<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bistroBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A2518"/>
      <stop offset="70%" stop-color="#2D140C"/>
      <stop offset="100%" stop-color="#1A0A06"/>
    </radialGradient>
    <linearGradient id="bistroGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D1A0"/>
      <stop offset="50%" stop-color="#D9A566"/>
      <stop offset="100%" stop-color="#B87B3E"/>
    </linearGradient>
    <path id="topTextPath" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
    <path id="bottomTextPath" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="94" fill="url(#bistroBg)" stroke="url(#bistroGold)" stroke-width="3.5"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#bistroGold)" stroke-width="1" stroke-dasharray="2,3"/>
  <circle cx="100" cy="100" r="58" fill="#1F0C07" stroke="url(#bistroGold)" stroke-width="1.5" opacity="0.85"/>

  <!-- Circular Text -->
  <text font-family="'Playfair Display', Georgia, serif" font-size="13" font-weight="700" fill="url(#bistroGold)" letter-spacing="2.5">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">THE IRON BISTRO</textPath>
  </text>
  <text font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="600" fill="url(#bistroGold)" letter-spacing="2">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">ESTD 1885 • RUSTIC COFFEE</textPath>
  </text>

  <!-- Crossed Fork and Spoon -->
  <g transform="translate(100, 100) scale(0.65)" stroke="url(#bistroGold)" fill="url(#bistroGold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fork (angled left) -->
    <g transform="rotate(-35)">
      <!-- Handle -->
      <path d="M-2,10 L-1.5,45 C-1.5,50 -4,55 -2,58 C0,60 4,58 2,55 L2,10 Z" fill="url(#bistroGold)" stroke="none"/>
      <!-- Tines -->
      <path d="M-9,-22 C-9,-5 -6,8 -2,10 L2,10 C6,8 9,-5 9,-22 L7,-22 C7,-7 5,2 0,2 C-5,2 -7,-7 -7,-22 Z" fill="url(#bistroGold)" stroke="none"/>
      <line x1="-3.5" y1="-22" x2="-3.5" y2="-6" stroke-width="1.8" stroke="#1F0C07"/>
      <line x1="3.5" y1="-22" x2="3.5" y2="-6" stroke-width="1.8" stroke="#1F0C07"/>
    </g>
    <!-- Spoon (angled right) -->
    <g transform="rotate(35)">
      <!-- Handle -->
      <path d="M-2,10 L-1.5,45 C-1.5,50 -4,55 -2,58 C0,60 4,58 2,55 L2,10 Z" fill="url(#bistroGold)" stroke="none"/>
      <!-- Bowl -->
      <ellipse cx="0" cy="-14" rx="10.5" ry="16" fill="url(#bistroGold)" stroke="none"/>
      <ellipse cx="0" cy="-14" rx="7.5" ry="12" fill="#1F0C07" opacity="0.35"/>
    </g>
  </g>
</svg>
