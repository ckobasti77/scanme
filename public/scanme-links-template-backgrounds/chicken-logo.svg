<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="blueHalftone" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2" fill="#186BB5" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Outer Black Comic Border & Blue Circle -->
  <circle cx="100" cy="100" r="92" fill="#298BE8" stroke="#000000" stroke-width="7"/>
  <!-- Halftone Pattern Overlay -->
  <circle cx="100" cy="100" r="88" fill="url(#blueHalftone)"/>

  <!-- Chicken Mascot -->
  <g transform="translate(100, 108) scale(1.18)" stroke="#000000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Red Comb -->
    <path d="M-18,-45 C-24,-60 -2,-68 4,-50 C12,-65 30,-55 24,-38 C32,-45 42,-30 30,-22 Z" fill="#E83038"/>

    <!-- Head and Body -->
    <path d="M-22,35 C-28,10 -25,-18 -6,-36 C5,-38 18,-35 24,-24 C34,-10 32,15 28,35 Z" fill="#F8CE32"/>

    <!-- Chest Tuft detail -->
    <path d="M-18,22 C-10,26 -2,22 4,28 C10,24 18,26 22,32" fill="none" stroke="#000000" stroke-width="3"/>

    <!-- Red Wattle -->
    <path d="M12,-4 C22,-4 26,12 18,18 C10,22 6,10 10,-2 Z" fill="#E83038"/>

    <!-- Yellow / Orange Beak -->
    <path d="M10,-18 L34,-8 L10,2 Z" fill="#F0921E"/>

    <!-- Eye -->
    <circle cx="4" cy="-18" r="4" fill="#000000" stroke="none"/>
    <circle cx="3" cy="-19.5" r="1.5" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
